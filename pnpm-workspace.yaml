# Paquetes a los que SI se les permite ejecutar su script de instalacion.
#
# pnpm los bloquea a todos por defecto desde la v10, por seguridad. Sin
# permiso, better-sqlite3 se queda sin su binario nativo y el servidor revienta
# al primer import con un error de "bindings" que no menciona la causa; esbuild
# se queda sin el suyo y falla el build del front.
#
# VAN LAS DOS FORMAS A PROPOSITO, y no es por desorden:
#
#   onlyBuiltDependencies  — lista. La que entienden pnpm 10 y 11.
#   allowBuilds            — mapa.  La que usa pnpm 12 en adelante.
#
# pnpm 12 MIGRA el fichero solo, y al migrarlo puede dejar los paquetes en
# `false`. Cuando eso pasa el sintoma es cruel: `pnpm approve-builds` dice
# "no packages awaiting approval" y `pnpm rebuild` dice "already up to date",
# porque para pnpm no hay nada pendiente -hay algo prohibido-. La instalacion
# termina en tres segundos, sin errores, y sin binario.
#
# Si algun dia vuelve a fallar, lo PRIMERO que hay que mirar es si estos
# valores siguen en true. Un `false` aqui no da ningun error en ningun sitio.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

allowBuilds:
  better-sqlite3: true
  esbuild: true
